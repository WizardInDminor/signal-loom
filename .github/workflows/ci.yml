name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e "./backend"
      - run: cd frontend && npm ci && npx playwright install --with-deps chromium
      - name: Start backend
        run: |
          cd backend
          SIGNAL_LOOM_DB=/tmp/e2e.sqlite3 nohup python -m uvicorn app.main:app --port 8000 --timeout-keep-alive 75 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
      - name: Start frontend
        run: |
          cd frontend
          npm run build
          nohup npm run start -- --port 3000 > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:3000/ > /dev/null && break; sleep 1; done
      - run: cd frontend && npm run test:e2e
      - if: failure()
        run: tail -n 50 /tmp/backend.log /tmp/frontend.log || true
